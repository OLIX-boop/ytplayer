name: Build iOS IPA (unsigned, for AltStore sideloading)

# Trigger manualmente da GitHub → Actions → "Run workflow"
# (così non parte ad ogni push e non sprechi minuti gratuiti)
on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Suffisso versione (opzionale, es. dev1)"
        required: false
        default: ""

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Xcode (stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Create .env from GitHub Secrets
        working-directory: app
        env:
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}
        run: |
          # Fallback ai default se i secret non sono configurati
          : "${API_URL:=http://192.168.1.10:3000}"
          : "${API_TOKEN:=}"
          cat > .env <<EOF
          EXPO_PUBLIC_API_URL=$API_URL
          EXPO_PUBLIC_API_TOKEN=$API_TOKEN
          EOF
          echo "Built with API_URL=$API_URL"

      - name: Expo prebuild
        working-directory: app
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: app/ios
        run: |
          pod install --repo-update
          ls -1 *.xcworkspace

      - name: Resolve workspace & scheme name
        id: scheme
        working-directory: app/ios
        run: |
          NAME=$(ls *.xcworkspace | sed 's/\.xcworkspace$//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Detected scheme: $NAME"

      - name: Build unsigned archive
        working-directory: app/ios
        run: |
          set -eo pipefail
          xcodebuild archive \
            -workspace "${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=

      - name: Verify .app was produced
        run: |
          set -e
          ls -la "$RUNNER_TEMP/build.xcarchive/Products/Applications/" || (echo "Archive failed"; exit 1)

      - name: Package as IPA
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP"/build.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          APP_NAME=$(ls Payload | head -n1 | sed 's/\.app$//')
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            IPA_NAME="${APP_NAME}-${SUFFIX}.ipa"
          else
            IPA_NAME="${APP_NAME}.ipa"
          fi
          zip -qr "$IPA_NAME" Payload
          echo "Created $IPA_NAME ($(du -h "$IPA_NAME" | cut -f1))"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytplayer-ios-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/${{ env.ipa_name }}
          retention-days: 30
          if-no-files-found: error
