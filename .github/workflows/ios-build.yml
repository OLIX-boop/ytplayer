name: Build iOS IPA (unsigned, for AltStore sideloading)

# Trigger manualmente da GitHub → Actions → "Run workflow"
# (così non parte ad ogni push e non sprechi minuti gratuiti)
on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Suffisso versione (opzionale, es. dev1)"
        required: false
        default: ""

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    # Env var visibili a TUTTI gli step (incluso xcodebuild che bundla il JS)
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Xcode (stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Create .env + inject into app.json extra
        working-directory: app
        run: |
          # Fallback se i secret sono vuoti
          API_URL="${EXPO_PUBLIC_API_URL:-http://192.168.1.10:3000}"
          API_TOKEN="${EXPO_PUBLIC_API_TOKEN:-}"

          # Scrivi .env per Metro/Expo bundler
          cat > .env <<EOF
          EXPO_PUBLIC_API_URL=$API_URL
          EXPO_PUBLIC_API_TOKEN=$API_TOKEN
          EOF

          # Inietta anche in app.json.expo.extra (così è leggibile via Constants.expoConfig.extra
          # anche se per qualche motivo .env non viene caricato durante xcodebuild bundle phase)
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.extra = cfg.expo.extra || {};
            cfg.expo.extra.EXPO_PUBLIC_API_URL = process.env.API_URL_FINAL;
            cfg.expo.extra.EXPO_PUBLIC_API_TOKEN = process.env.API_TOKEN_FINAL;
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
            console.log("Injected into app.json.expo.extra:", cfg.expo.extra);
          '
        env:
          API_URL_FINAL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          API_TOKEN_FINAL: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}

      - name: Expo prebuild
        working-directory: app
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: app/ios
        run: |
          set -e
          # Primo tentativo: usa la cache locale del runner (veloce, no CDN)
          if pod install; then
            echo "pod install OK (cached specs)"
          else
            echo "First attempt failed — retrying with repo update..."
            # Piccola pausa per eventuali hiccup di rete + retry con update
            sleep 10
            for i in 1 2 3; do
              if pod install --repo-update; then
                echo "pod install OK on retry $i"
                break
              fi
              echo "Retry $i failed, waiting before next..."
              sleep $((i * 15))
            done
          fi
          ls -1d *.xcworkspace

      - name: Resolve workspace & scheme name
        id: scheme
        working-directory: app/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: no .xcworkspace found in $(pwd)"
            ls -la
            exit 1
          fi
          NAME="${WORKSPACE%.xcworkspace}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Detected workspace: $WORKSPACE"
          echo "Detected scheme:    $NAME"

      - name: Disable code signing on all Xcode projects
        working-directory: app/ios
        run: |
          ruby <<'RUBY'
            require 'xcodeproj'

            def disable_signing(project_path)
              project = Xcodeproj::Project.open(project_path)
              configs = 0
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED']        = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED']       = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY']          = ''
                  config.build_settings['CODE_SIGN_ENTITLEMENTS']      = ''
                  config.build_settings['DEVELOPMENT_TEAM']            = ''
                  config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                  config.build_settings['EXPO_DEVELOPMENT_TEAM']       = ''
                  configs += 1
                end
              end
              project.save
              puts "  #{project_path}: disabled on #{configs} configs (#{project.targets.count} targets)"
            end

            main = Dir.glob('*.xcodeproj').first
            raise 'main .xcodeproj not found' unless main
            puts 'Disabling code signing...'
            disable_signing(main)
            disable_signing('Pods/Pods.xcodeproj') if File.exist?('Pods/Pods.xcodeproj')
          RUBY

      - name: Build unsigned archive
        working-directory: app/ios
        run: |
          set -eo pipefail
          xcodebuild archive \
            -workspace "${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=

      - name: Verify .app was produced
        run: |
          set -e
          ls -la "$RUNNER_TEMP/build.xcarchive/Products/Applications/" || (echo "Archive failed"; exit 1)

      - name: Package as IPA
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP"/build.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          APP_NAME=$(ls Payload | head -n1 | sed 's/\.app$//')
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            IPA_NAME="${APP_NAME}-${SUFFIX}.ipa"
          else
            IPA_NAME="${APP_NAME}.ipa"
          fi
          zip -qr "$IPA_NAME" Payload
          echo "Created $IPA_NAME ($(du -h "$IPA_NAME" | cut -f1))"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ytplayer-ios-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/${{ env.ipa_name }}
          retention-days: 30
          if-no-files-found: error
